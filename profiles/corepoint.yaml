# CorePoint remains the regression target: this profile's detector block is
# asserted equal to the engine's built-in defaults by a test, so the two cannot
# drift apart silently.
app:
  id: corepoint-teller
  vendor: CorePoint Systems
  ui_version_range: ">=3.1 <4"
  origin: http://localhost:4478
policy: policies/default.yaml
# No signon block: the fictional CorePoint app is entered through the
# --mock-auth training-session cookie, which stays the test/demo path.
detectors:
  session_lost:
    paths: ["/login"]
    patterns: []
  app_error:
    patterns:
      - "Unexpected Application Error"
      - "could not complete the request"
      - "HTTP\\s*5\\d\\d"
  escalation:
    patterns:
      - "Supervisor override required"
outcome_templates:
  - code: MEMBER_NOT_FOUND
    when:
      - kind: text_visible
        pattern: "No member found"
        frame: workarea
    returns:
      found: false
  - code: PERMISSION_DENIED
    when:
      - kind: text_visible
        pattern: "Access denied"
        frame: workarea
recovery_templates:
  - id: dismiss_session_modal
    condition:
      kind: dialog_present
      textPattern: "Session expiring"
    action:
      kind: click
      target:
        strategies:
          - kind: role_name
            role: button
            name: Continue
            frame: workarea
            unique: true
            confidence: 0.9
    max_attempts: 1
